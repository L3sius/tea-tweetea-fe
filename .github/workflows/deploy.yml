# Every push to main is checked (lint, unit tests, type-check), built and put live at tea-osrs.com.
# A failed check deploys nothing. The droplet keeps the previous release; docs/deploy.md says how to
# roll back.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order; a newer push waits rather than cutting one off half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The npm lint scripts fix what they can; here they only check.
      - name: Lint
        run: npx oxlint . && npx eslint .

      - name: Unit tests
        run: npm test

      # Type-checks, then builds dist/ with .env.production.
      - name: Build
        run: npm run build

      - name: Name the release
        run: |
          id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}"
          echo "RELEASE=$id" >> "$GITHUB_ENV"
          printf '{"release":"%s","commit":"%s","run":"%s/%s/actions/runs/%s"}\n' \
            "$id" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > dist/release.json

      # The key may only run tweetea-release on the droplet (deploy/setup-droplet.sh).
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            tweetea-deploy@161.35.173.209 "deploy $RELEASE"

      # Only a warning until tea-osrs.com points at the droplet.
      - name: Check the live site
        continue-on-error: true
        run: curl -fsS https://tea-osrs.com/release.json | grep -q "$RELEASE"
